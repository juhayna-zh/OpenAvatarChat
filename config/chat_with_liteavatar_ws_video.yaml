default:
  logger:
    log_level: "INFO"
  service:
    # 无鉴权端口，必须只绑本机；命令行 --host 可覆盖
    host: "127.0.0.1"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    # LiteAvatar 的 worker 池大小由它决定（handler_manager 注入到每个 handler）。
    # 客户端主动断连有概率让 ws_input_delegate 的 teardown 卡在 finally 的 gather 上，
    # worker 永远停在 BUSY；池子给大一点，几个泄漏不会把整个服务打死。
    concurrent_limit: 4
    handler_search_path:
      - "src/handlers"
    handler_configs:
      # 与 chat_with_openai_compatible_bailian_cosyvoice.yaml 相同的流水线，
      # 只把 RtcClient 换成 WsVideoClient：服务端渲染的画面改走 WebSocket，
      # 而不是 WebRTC。上行协议与 ws_client 完全一致。
      WsVideoClient:
        module: client/ws_video_client/ws_video_client_handler
        connection_ttl: 900
        jpeg_quality: 85
        video_fps: 25
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      SenseVoice:
        enabled: True
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      CosyVoice:
        enabled: True
        module: tts/bailian_tts/tts_handler_cosyvoice_bailian
        voice: "longxiaochun"
        model_name: "cosyvoice-v1"
        # api_key: "" # default=os.getenv("DASHSCOPE_API_KEY")
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "qwen-plus"
        enable_video_input: False
        history_length: 20
        system_prompt: "请你扮演一个 AI 助手，用简短的两三句对话来回答用户的问题，并在对话内容中加入合适的标点符号，不需要讨论标点符号相关的内容"
        api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        # api_key: "" # default=os.getenv("DASHSCOPE_API_KEY")
      LiteAvatar:
        module: avatar/liteavatar/avatar_handler_liteavatar
        avatar_name: 20250408/sample_data
        fps: 25
        debug: false
        enable_fast_mode: false
        use_gpu: true
